de: &DEFAULT_DE
  header:
    title: Die Sonne scheint!
    text: Lassen Sie uns Watt machen.
    button: Watt machen
    buttonlink: "#services"

  services:
    title: "Watt geht?"
    text: "Wenn wir ehrlich sind geht es doch darum etwas zu sparen. Was eignet sich da besser als seinen eigenen Strom zu machen und diesen entsprechend optimal zu nutzen. Also das Elektro Auto eben genau dann zu laden, wenn die PV gerade Überschuss produziert und ins Netz einspeist. Oder Geräte wie Spül- oder Waschmaschine dann laufen zu lassen wenn ein zeitbasierter Stromtarif gerade sehr günstig ist.<br/>Als Diplom Elektroingenieur mit über 30 Jahren Erfahrung, kann ich Sie bei allen Themen rund um PV, Speicher, E-Mobilität & Smart Home beraten. Fundiert, herstellerneutralrt und auf Ihr Gebäude maßgeschneidert zugeschnitten."
    section: services
    list:
      - title: "Watt machen"
        desc: "PV, Balkonkraftwerk oder eine bestehende Anlage erweitern."
        icon: fas fa-car-battery #find more at https://fontawesome.com/icons
      - title: "Watt speichernr"
        desc: "Sie möchten Ihren am Tag erzeugen Photovoltaik Strom auch Nachts nutzen? Beratung und bau individuelle und kostengünstiger Stromspeicher für **alle** PV Anlagen."
        icon: fas fa-car-battery #find more at https://fontawesome.com/icons
      - title: "Watt vermarkten"
        desc: "Sie möchten Ihren am Tag erzeugen Photovoltaik Strom auch Nachts nutzen? Beratung und bau individuelle und kostengünstiger Stromspeicher für **alle** PV Anlagen."
        icon: fas fa-car-battery #find more at https://fontawesome.com/icons
      - title: "Watt sparen"
        desc: "Sie möchten Ihren am Tag erzeugen Photovoltaik Strom auch Nachts nutzen? Beratung und bau individuelle und kostengünstiger Stromspeicher für **alle** PV Anlagen."
        icon: fas fa-car-battery #find more at https://fontawesome.com/icons
      - title: "Smart Home"
        desc: "Sie wollen Ihren Strom dann verbrauchen, wenn er vorhanden ist? Smart Home Beratung und individuelle Smart Home Lösungen"
        icon: fas fa-home
      - title: "Watt nicht"
        desc: "Ich bin leider kein eingetragener Elektroinstallateur. Damit kann ich kein Elektroinstallationen durchführen! Ich sprechen aber gerne mit Ihrem Elektriker und stimme die notwendigen Massnahmen mit Ihm ab."
        icon: fas fa-ghost
      - title: "Wallbox"
        desc: "Ihre Wallbox ist nicht smart genug"
        icon: fas fa-charging-station
      - title: "evcc"
        desc: "Echtes überschuss laden auch mit Ihrer aktuellen Wallbox"
        icon: fas fa-bolt     
      - title: "Home Assistant"
        desc: "Machen Sie Ihr Haus smarter, damit es dann Strom verbraucht, wenn Ihre PV ihn liefert"
        icon: fas fa-home
#      - title: "Geheimnis"
#        desc: "Sie wissen nicht ob man Ihre Frage überhaupt beantworten kann? Stellen Sie mich auf die Probe"
#        icon: fas fa-ghost
  
