  about:
    title: "Über mich"
    text: "Die Story warum alles so gekommen ist, wie es ist."
    body: "In der Schule schon mit der Märlin Eisenbahn gespielt. Dann mit dem Kosmos Elektronik Baukasten den Radio und die Lichtorgel gebaut. <br /><br /> Nachdem dann die ersten **programierbaren** Geräte in die Haushalte einzogen, war Bedarf nach jemand der das kann. So kamen Verwandte, Bekannte und Nachbarn ob ich nicht mal den Videorekorder, das Telefon oder ganz neumodisch das Modem programmieren könnte. <br /><br /> Damit lag nichts näher als an der Technischen Hochschule Darmstadt Elektrotechnik zu studieren. <br /><br /> Nach ein paar Jahrzehnten haben sich mehr oder weniger nur die Geräte geändert. Nun sollen Photovoltaik Anlagen geplant werden, Speicher ergänzt werden, Wallboxen programmiert werden oder umfangreich das Haus oder die Wohnung per Smart Home aufgerüstet werden. <br /> <br /> **Kein Problem!**"
