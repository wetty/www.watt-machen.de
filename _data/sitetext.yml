de: &DEFAULT_DE
  header:
    title: Die Sonne scheint!
    text: Lassen Sie uns Watt machen.
    button: Watt machen
    buttonlink: "#services"

  services:
    title: "Watt geht?"
    text: "Wenn wir ehrlich sind geht es doch darum, etwas zu sparen. <br /><br /> Was eignet sich da besser als seinen eigenen Strom zu machen und diesen entsprechend optimal zu nutzen. Also wenn die PV gerade Überschuss produziert z.B. das Elektro Auto genau dann zu laden. Überschüssigen Strom zu speichern, um ihn in der Nacht sekbst zu nutzen. <br /><br /> Oder Geräte wie Spül- oder Waschmaschine dann laufen zu lassen wenn ein zeitbasierter Stromtarif gerade sehr günstig ist. Auch wenn das mitten in der Nacht ist.<br /><br />Zu kompliziert? Nein, als Diplom Elektroingenieur mit über 30 Jahren Erfahrung, kann ich Sie bei allen diesen Themen rund um PV, Speicher, E-Mobilität & Smart Home beraten. Fundiert, herstellerneutralt und auf Ihre Wünsche maßgeschneidert zugeschnitten."
    section: services
    list:
      - title: "Watt machen"
        desc: "Vom Balkonkraftwerk über eine PV Erweiterung bis zur kompletten Anlage. Ich kann Ihnen dazu Ihre Fragen beantworten."
        icon: fas fa-solar-panel #find more at https://fontawesome.com/icons
      - title: "Watt speichern"
        desc: "Günstige Strom Speicher Systeme für **alle** PV Anlagen! Auch wenn Ihr Elektriker oder Solateur sagt es wäre zu teuer oder kompliziert. Selbst Speicher ohne PV können sich mit dynamischen Strompreisen lohnen."
        icon: fas fa-car-battery #find more at https://fontawesome.com/icons
      - title: "Watt sparen"
        desc: "Mit § 14a des Energiewirtschaftsgesetzes (EnWG) jährlich rund 130.- sparen. Zusätzlich auch noch für Zeitbasierte Stromtarife ein paar cent weniger bezahlen."
        icon: fas fa-euro-sign #find more at https://fontawesome.com/icons
      - title: "Watt optimieren"
        desc: "Nutzen Sie Ihren eigenen Strom optimal. Dank Smart Home oder **HEMS** (Home Energy Management System) geht nichts von Ihrem Strom verloren und Sie verringern Ihren Netzbezug"
        icon: fas fa-euro-sign #find more at https://fontawesome.com/icons
      - title: "Watt dunkel"
        desc: "Bei Stromausfall schaltet sich normalerweise auch die PV Anlage ab! Nur wenn die Anlage notstromfähig ist, produziert sie weiter Strom."
        icon: fas fa-solar-panel #find more at https://fontawesome.com/icons
      - title: "Watt vermarkten"
        desc: "Nach der aktuellen/zukünftigen Gesetzeslage wird die garantierte Einspeisevergütung für eingespeisten Strom immer weniger bzw. fällt ganz weg. Stromcommunities oder Direktvermarktung an der Börse können hier helfen."
        icon: fas fa-plus #find more at https://fontawesome.com/icons
      - title: "Watt laden"
        desc: "Ihre Wallbox lädt immer mit voller Leistung, oder zieht sogar Ihren Stromspeicher leer? Sehr viele Wallboxen lassen sich komfortabel mit evcc steuern. Damit machen sie echtes Überschuss laden."
        icon: fas fa-charging-station
      - title: "Watt nicht"
        desc: "Ich bin leider kein eingetragener Elektroinstallateur. Damit kann ich kein Elektroinstallationen durchführen! Ich sprechen aber gerne mit Ihrem Elektriker und stimme die notwendigen Massnahmen mit Ihm ab."
        icon: fas fa-ghost
#      - title: "Smart Home"
#        desc: "Sie wollen Ihren Strom dann verbrauchen, wenn er vorhanden ist? Smart Home Beratung und individuelle Smart Home Lösungen"
#        icon: fas fa-home
#      - title: "Wallbox"
#        desc: "Ihre Wallbox ist nicht smart genug"
#        icon: fas fa-charging-station
