# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# This file is *NOT* reloaded automatically when you use 'bundle exec jekyll serve'.
# If you change this file, please restart the server process.

# Site settings
# are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

#theme: jekyll-agency
remote_theme: raviriley/agency-jekyll-theme

url    : "https://watt-machen.de" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "" # the subpath of your site, e.g. /blog

title      : Photovoltaik, Speicher, Elektro Mobilität, Smart Home | Watt machen
email      : thomas@wetterer.de #this is also the email contact forms will go to
description: "Unabhängige Beratung und Planung von Photovoltaik, Strom Speicher, Elektro Mobilität, Smart Home und Direktvermarktung durch erfahrenen Elektrotechnik Ingenieur"
author     : Thomas Wetterer
logo:     #optional, defaults to site title
 path: https://imgproxy.wetterer.de/insecure/format:webp/plain/https://watt-machen.de/assets\img\clients\watt-machen-logo-schrift.png
 height: 80 #height in px, defaults to 52px

locale: "de-DE" # See available languages in _data/sitetext.yml

permalink: /:title/

include:
  - .htaccess
#  - _pages

#defaults:
#  - scope:
#      path: "_pages"
#      type: "pages" 
#    values:
#      layout: page # overrides previous default layout
#  - scope:
#      path: "_portfolio"
#      type: "pages" 
#    values:
#      layout: page # overrides previous default layout

defaults:
  - scope:
      path: "" # Gilt für die gesamte Website
    values:
      layout: "page" # Name deiner Layout-Datei in _layouts (ohne .html)


analytics:
  google: #Google Analytics tracking code here

collections:
  pages:
    output: true
    permalink: /:title/
#    values:
#      layout: page # overrides previous default layout
  portfolio:
    output: true
    permalink: /:title/
    values:
      layout: page # overrides previous default layout
#    permalink: /:collection/:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md

markdown: kramdown

# Uncomment following line to use Formspree form ID based URL instead of email based URL
# Details: https://help.formspree.io/hc/en-us/articles/360017735154-How-to-prevent-spam
# formspree_form_path: "f/a_form_id"
formspree_form_path: "f/mwlenwna"

plugins:
  - jekyll-remote-theme
  - jekyll-sitemap

#  - jemoji
#  - jekyll-target-blank